name: Lightbox
options:
  bundleIdPrefix: com.stephenbritton
  deploymentTarget:
    macOS: "14.0"

targets:
  Lightbox:
    type: application
    platform: macOS
    sources:
      - path: Lightbox
        excludes:
          - "App Icon.icon/**"
      - path: Lightbox/App Icon.icon
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenbritton.Lightbox
        PRODUCT_NAME: Lightbox
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Lightbox/Lightbox.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Scalable Vector Graphics
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.svg-image
            NSDocumentClass: ""
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.svg-image
            UTTypeConformsTo:
              - public.xml
              - public.image
            UTTypeDescription: Scalable Vector Graphics
            UTTypeTagSpecification:
              public.filename-extension:
                - svg
              public.mime-type: image/svg+xml
        LSApplicationCategoryType: public.app-category.developer-tools

  LightboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LightboxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenbritton.LightboxTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Lightbox

schemes:
  Lightbox:
    build:
      targets:
        Lightbox: all
        LightboxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LightboxTests
    archive:
      config: Release
