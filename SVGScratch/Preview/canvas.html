<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #cccccc 25%, transparent 25%),
      linear-gradient(-45deg, #cccccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cccccc 75%),
      linear-gradient(-45deg, transparent 75%, #cccccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
  }

  #ref {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    display: none;
  }

  #host {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #host svg {
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>
  <div id="stage">
    <img id="ref">
    <div id="host"></div>
  </div>
  <script src="canvas.js"></script>
</body>
</html>
