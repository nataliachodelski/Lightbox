<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #dcdcdc;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #artboard {
    position: absolute;
    top: 0;
    left: 0;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
  }

  #artboard.bg-checkerboard {
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #cccccc 25%, transparent 25%),
      linear-gradient(-45deg, #cccccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cccccc 75%),
      linear-gradient(-45deg, transparent 75%, #cccccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  #artboard.bg-white {
    background: #ffffff;
  }

  #artboard.bg-black {
    background: #000000;
  }

  #ref {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    display: none;
  }

  #host {
    position: absolute;
    top: 0;
    left: 0;
  }

  .panning {
    cursor: grabbing !important;
  }

  .pan-ready {
    cursor: grab;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="artboard" class="bg-checkerboard"></div>
    <img id="ref">
    <div id="host"></div>
  </div>
  <script src="canvas.js"></script>
</body>
</html>
